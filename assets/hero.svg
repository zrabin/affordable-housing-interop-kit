<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Diagram comparing today's tangled affordable housing data handoffs with a shared open standard">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .cardlabel { font: 600 14px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e293b; text-anchor: middle; }
      .panelcap { font: 700 13px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; letter-spacing: 2px; text-anchor: middle; }
      .tangle { stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 5 4; opacity: 0.85; }
      .spoke { stroke: #2563eb; stroke-width: 1.8; opacity: 0.65; }
      .tinylabel { font: italic 11px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; text-anchor: middle; stroke: #f8fafc; stroke-width: 3px; paint-order: stroke; }
      .caption { font: 400 12.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="538" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- panel captions -->
  <text class="panelcap" x="295" y="40">TODAY</text>
  <text class="panelcap" x="905" y="40">WITH A SHARED STANDARD</text>

  <!-- divider arrow -->
  <line x1="577" y1="70" x2="577" y2="470" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M 565 255 L 597 255 M 590 248 L 597 255 L 590 262" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LEFT: the tangle -->
  <g>
    <line class="tangle" x1="145" y1="92"  x2="425" y2="132"/>
    <line class="tangle" x1="145" y1="92"  x2="425" y2="322"/>
    <line class="tangle" x1="145" y1="92"  x2="275" y2="442"/>
    <line class="tangle" x1="145" y1="92"  x2="170" y2="262"/>
    <line class="tangle" x1="425" y1="132" x2="170" y2="262"/>
    <line class="tangle" x1="425" y1="132" x2="275" y2="442"/>
    <line class="tangle" x1="425" y1="132" x2="425" y2="322"/>
    <line class="tangle" x1="170" y1="262" x2="425" y2="322"/>
    <line class="tangle" x1="170" y1="262" x2="275" y2="442"/>
    <line class="tangle" x1="425" y1="322" x2="275" y2="442"/>

    <text class="tinylabel" x="278" y="100">email chains</text>
    <text class="tinylabel" x="298" y="205">PDF checklists</text>
    <text class="tinylabel" x="150" y="180">phone calls</text>
    <text class="tinylabel" x="435" y="228">duplicate data entry</text>
    <text class="tinylabel" x="212" y="360">portal exports</text>
    <text class="tinylabel" x="365" y="395">status unknown</text>

    <rect class="card" x="60"  y="70"  width="170" height="44" rx="8"/>
    <text class="cardlabel" x="145" y="97">Applicants</text>
    <rect class="card" x="330" y="110" width="190" height="44" rx="8"/>
    <text class="cardlabel" x="425" y="137">Marketing agents</text>
    <rect class="card" x="70"  y="240" width="200" height="44" rx="8"/>
    <text class="cardlabel" x="170" y="267">Owners &amp; developers</text>
    <rect class="card" x="330" y="300" width="190" height="44" rx="8"/>
    <text class="cardlabel" x="425" y="327">Compliance teams</text>
    <rect class="card" x="180" y="420" width="190" height="44" rx="8"/>
    <text class="cardlabel" x="275" y="447">Public agencies</text>

    <text class="caption" x="295" y="505">Every handoff is bespoke. Data is re-typed, statuses go stale,</text>
    <text class="caption" x="295" y="522">and audits are reconstruction work.</text>
  </g>

  <!-- RIGHT: the shared layer -->
  <g>
    <line class="spoke" x1="730"  y1="104" x2="835" y2="225"/>
    <line class="spoke" x1="1040" y1="104" x2="965" y2="225"/>
    <line class="spoke" x1="735"  y1="360" x2="835" y2="275"/>
    <line class="spoke" x1="1045" y1="360" x2="965" y2="275"/>
    <line class="spoke" x1="900"  y1="440" x2="900" y2="285"/>

    <rect class="card" x="655" y="60"  width="150" height="44" rx="8"/>
    <text class="cardlabel" x="730" y="87">Applicants</text>
    <rect class="card" x="955" y="60"  width="170" height="44" rx="8"/>
    <text class="cardlabel" x="1040" y="87">Marketing agents</text>
    <rect class="card" x="645" y="360" width="180" height="44" rx="8"/>
    <text class="cardlabel" x="735" y="387">Owners &amp; developers</text>
    <rect class="card" x="960" y="360" width="170" height="44" rx="8"/>
    <text class="cardlabel" x="1045" y="387">Compliance teams</text>
    <rect class="card" x="815" y="440" width="170" height="44" rx="8"/>
    <text class="cardlabel" x="900" y="467">Public agencies</text>

    <rect x="740" y="215" width="320" height="70" rx="12" fill="#2563eb"/>
    <text x="900" y="243" text-anchor="middle" style="font: 700 15px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">Open Housing Data Standard</text>
    <text x="900" y="266" text-anchor="middle" style="font: 400 11.5px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#dbeafe">packets · statuses · documents · notices · audit</text>

    <text class="caption" x="905" y="505">One shared language. Consented data, machine-readable statuses,</text>
    <text class="caption" x="905" y="522">and an audit trail by default.</text>
  </g>
</svg>
